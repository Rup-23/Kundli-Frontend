<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kundli — Janma Patrika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E1F;
    --bg-card:#141832;
    --border:#2A2F58;
    --gold:#E8B84B;
    --gold-soft:#F4D488;
    --text:#EDEAF6;
    --text-muted:#9691B8;
    --violet:#7C6FCE;
    --error:#E8735A;
    --success:#8FD6A8;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(237,234,246,0.6), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(237,234,246,0.5), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(237,234,246,0.4), transparent),
      radial-gradient(1px 1px at 30% 85%, rgba(237,234,246,0.5), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(237,234,246,0.3), transparent),
      radial-gradient(1px 1px at 45% 40%, rgba(237,234,246,0.4), transparent),
      linear-gradient(180deg, #0B0E1F 0%, #0E1226 100%);
    font-family:'Inter', sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .twinkle{
    position:fixed;
    border-radius:50%;
    background:var(--gold-soft);
    animation:twinkle 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  .page{
    width:100%;
    max-width:480px;
  }

  .header{
    text-align:center;
    margin-bottom:32px;
  }

  .mark{
    width:52px;
    height:52px;
    margin:0 auto 18px;
    display:block;
  }
  .mark.spinning{
    animation:spin 2.4s linear infinite;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:42px;
    letter-spacing:0.02em;
    margin:0 0 6px;
    color:var(--text);
  }

  .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    color:var(--gold-soft);
    letter-spacing:0.04em;
    margin:0;
  }

  form{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }

  .field{
    margin-bottom:20px;
  }
  .field:last-of-type{
    margin-bottom:0;
  }

  label{
    display:block;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:8px;
  }

  label .optional{
    text-transform:none;
    letter-spacing:0;
    opacity:0.7;
  }

  input{
    width:100%;
    background:#0F1330;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--text);
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder{
    color:#5C577F;
  }
  input:focus{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(124,111,206,0.25);
  }
  input[type="date"], input[type="time"]{
    color-scheme:dark;
  }

  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  .submit-row{
    margin-top:28px;
  }

  button{
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:8px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#241B04;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  }
  button:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 10px 24px -8px rgba(232,184,75,0.5);
  }
  button:disabled{
    opacity:0.65;
    cursor:default;
  }

  .status-box{
    max-height:0;
    overflow:hidden;
    opacity:0;
    margin-top:0;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
    transition:max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
  }
  .status-box.visible{
    max-height:120px;
    opacity:1;
    margin-top:18px;
    padding:12px 14px;
  }
  .status-box.error{
    background:rgba(232,115,90,0.12);
    border:1px solid rgba(232,115,90,0.35);
    color:#F3B3A4;
  }
  .status-box.success{
    background:rgba(143,214,168,0.1);
    border:1px solid rgba(143,214,168,0.3);
    color:var(--success);
  }

  .footnote{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:22px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    .twinkle, .mark.spinning{ animation:none; }
  }

  @media (max-width:420px){
    .row{ grid-template-columns:1fr; }
    form{ padding:28px 22px; }
    h1{ font-size:34px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <svg class="mark" id="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="92" height="92" stroke="#E8B84B" stroke-width="1.5" opacity="0.9"/>
      <path d="M4 4 L96 96 M96 4 L4 96" stroke="#E8B84B" stroke-width="1" opacity="0.55"/>
      <path d="M50 4 L96 50 L50 96 L4 50 Z" stroke="#E8B84B" stroke-width="1.2" opacity="0.85"/>
      <circle cx="50" cy="50" r="2.5" fill="#E8B84B"/>
    </svg>
    <h1>Kundli</h1>
    <p class="subtitle">janma patrika · your cosmic blueprint</p>
  </div>

  <form id="kundli-form">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="As you'd like it on the chart" required />
    </div>

    <div class="row">
      <div class="field">
        <label for="dateOfBirth">Date of birth</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" required />
      </div>
      <div class="field">
        <label for="timeOfBirth">Time of birth</label>
        <input type="time" id="timeOfBirth" name="timeOfBirth" required />
      </div>
    </div>

    <div class="field">
      <label for="place">Place of birth</label>
      <input type="text" id="place" name="place" placeholder="City, State, Country" required />
    </div>

    <div class="field">
      <label for="email">Email <span class="optional">(optional)</span></label>
      <input type="email" id="email" name="email" placeholder="you@example.com" />
    </div>

    <div class="submit-row">
      <button type="submit" id="submit-btn">Generate Kundli PDF</button>
    </div>

    <div class="status-box" id="status-box"></div>
  </form>

  <p class="footnote">Your chart is generated and downloaded directly —<br>nothing is stored on any server.</p>
</div>

<script>
  // Star field
  const starCount = 18;
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'twinkle';
    const size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.animationDelay = (Math.random() * 4) + 's';
    document.body.appendChild(star);
  }

  // ---- Update this to your backend's full URL if the frontend and API
  // are NOT hosted on the same origin, e.g. 'https://your-backend.com/generate-kundli'
  const API_URL = 'https://internship-backend-production-7ad0.up.railway.app/generate-kundli';

  const form = document.getElementById('kundli-form');
  const submitBtn = document.getElementById('submit-btn');
  const statusBox = document.getElementById('status-box');
  const mark = document.getElementById('mark');
  
  function toDDMMYYYY(isoDate) {
    const [y, m, d] = isoDate.split('-');
    return `${d}/${m}/${y}`;
  }

  function toHHMMSS(time) {
    // <input type="time"> returns "HH:MM" — the backend/ProKerala needs seconds too
    return time.length === 5 ? `${time}:00` : time;
  }

  function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = `status-box ${type} visible`;
  }

  function hideStatus() {
    statusBox.className = 'status-box';
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadBase64Pdf(base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteNumbers[i] = byteChars.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });
    downloadBlob(blob, filename);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideStatus();

    const fd = new FormData(form);
    const payload = {
      name: fd.get('name').trim(),
      dateOfBirth: toDDMMYYYY(fd.get('dateOfBirth')),
      timeOfBirth: toHHMMSS(fd.get('timeOfBirth')),
      place: fd.get('place').trim(),
      email: (fd.get('email') || '').trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Casting your chart…';
    mark.classList.add('spinning');

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const contentType = response.headers.get('content-type') || '';

      if (!response.ok) {
        let message = 'Something went wrong. Please try again.';
        if (contentType.includes('application/json')) {
          const errData = await response.json();
          message = errData.error || message;
        }
        throw new Error(message);
      }

      const filename = `${payload.name.replace(/\s+/g, '_') || 'kundli'}.pdf`;

      if (contentType.includes('application/json')) {
        // Handles the case where the backend wraps the PDF as base64 in JSON
        const data = await response.json();
        if (data.pdf_base64) {
          downloadBase64Pdf(data.pdf_base64, filename);
        } else {
          throw new Error(data.error || 'Unexpected response from server.');
        }
      } else {
        // Handles a raw application/pdf binary response
        const blob = await response.blob();
        downloadBlob(blob, filename);
      }

      showStatus('Your kundli has been generated and downloaded.', 'success');
    } catch (err) {
      showStatus(err.message || 'Could not generate your kundli. Please try again.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Generate Kundli PDF';
      mark.classList.remove('spinning');
    }
  });
</script>

</body>
</html>
